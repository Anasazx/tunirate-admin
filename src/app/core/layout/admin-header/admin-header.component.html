<header class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-slate-200 bg-white/90 px-4 backdrop-blur sm:px-6 lg:px-8">
  <button type="button" class="btn-ghost -ml-2 lg:hidden" (click)="menu.emit()" aria-label="Open menu">
    <lucide-icon [img]="Menu" [size]="20" />
  </button>

  <div class="flex-1"></div>

  @if (user(); as u) {
    <div class="relative">
      <button type="button" class="flex items-center gap-3 rounded-lg px-2 py-1.5 transition hover:bg-slate-100"
              (click)="userMenuOpen.set(!userMenuOpen())" [attr.aria-expanded]="userMenuOpen()">
        <span class="flex h-8 w-8 items-center justify-center rounded-full bg-brand-100 text-xs font-semibold text-brand-700">
          {{ initials(u.user.name) }}
        </span>
        <span class="hidden text-left sm:block">
          <span class="block text-sm font-medium leading-tight text-slate-900">{{ u.user.name }}</span>
          <span class="block text-xs text-slate-500">Administrator</span>
        </span>
        <lucide-icon [img]="ChevronDown" [size]="16" class="text-slate-400" />
      </button>

      @if (userMenuOpen()) {
        <div class="absolute right-0 mt-2 w-60 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-lg">
          <div class="border-b border-slate-100 px-4 py-3">
            <p class="truncate text-sm font-medium text-slate-900">{{ u.user.name }}</p>
            <p class="truncate text-xs text-slate-500">{{ u.user.email }}</p>
          </div>
          <button type="button" class="flex w-full items-center gap-2 px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50" (click)="logout()">
            <lucide-icon [img]="LogOut" [size]="16" class="text-slate-400" /> Sign out
          </button>
        </div>
      }
    </div>
  }
</header>
