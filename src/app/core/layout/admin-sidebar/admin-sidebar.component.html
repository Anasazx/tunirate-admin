<!-- Backdrop on small screens -->
@if (open()) {
  <div class="fixed inset-0 z-30 bg-slate-900/40 lg:hidden" (click)="close.emit()"></div>
}

<aside class="fixed inset-y-0 left-0 z-40 flex w-64 flex-col border-r border-slate-200 bg-white transition-transform duration-200 lg:translate-x-0"
       [class.-translate-x-full]="!open()">

  <div class="flex h-16 items-center justify-between gap-3 border-b border-slate-100 px-5">
    <a routerLink="/" class="flex items-end gap-2" aria-label="ReviewHood Admin">
      <img src="logo.png" alt="ReviewHood" class="h-7 w-auto" />
      <span class="mb-0.5 rounded bg-ink px-1.5 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-white">Admin</span>
    </a>
    <button type="button" class="btn-ghost btn-sm lg:hidden" (click)="close.emit()" aria-label="Close menu">
      <lucide-icon [img]="X" [size]="18" />
    </button>
  </div>

  <nav class="flex-1 overflow-y-auto px-3 py-4">
    @for (section of sections; track section.title) {
      <p class="mb-1 mt-4 px-3 text-[11px] font-semibold uppercase tracking-wider text-slate-400 first:mt-0">{{ section.title }}</p>
      <ul class="space-y-0.5">
        @for (item of section.items; track item.path) {
          <li>
            <a [routerLink]="item.path"
               routerLinkActive="bg-brand-50 text-brand-700 [&_.nav-icon]:text-brand-600"
               [routerLinkActiveOptions]="{ exact: !!item.exact }"
               class="group flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-50 hover:text-slate-900">
              <lucide-icon [img]="item.icon" [size]="18" class="nav-icon text-slate-400 group-hover:text-slate-600" />
              <span class="flex-1">{{ item.label }}</span>
              @if (item.badge && item.badge() > 0) {
                <span class="rounded-full bg-amber-100 px-2 py-0.5 text-xs font-semibold text-amber-800" [title]="item.badge() + ' waiting for review'">
                  {{ item.badge() }}
                </span>
              }
            </a>
          </li>
        }
      </ul>
    }
  </nav>

  <p class="border-t border-slate-100 px-5 py-3 text-xs text-slate-400">© {{ 2026 }} ReviewHood</p>
</aside>
