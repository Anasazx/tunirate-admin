<div class="p-6">


  <!-- header -->
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-2xl font-bold">Companies</h2>

    <button
      routerLink="/companies/new"
      class="bg-blue-600 text-white px-3 py-1 rounded">
      New Company
    </button>
  </div>

  <br>
  <br>





  <!-- search bar -->
<div class="mb-4">
  <input
    type="text"
    [(ngModel)]="searchTerm"
    (input)="filterCompanies()"
    placeholder="Search companies..."
    class="w-full md:w-80 border px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
  />
</div>




  <!-- loading / error -->
  <div *ngIf="loading" class="p-4 bg-white rounded border">
    Loading...
  </div>

  <div *ngIf="error" class="p-4 bg-red-50 text-red-700 rounded border">
    {{ error }}
  </div>


  <div class="p-4 bg-gray-50 text-gray-600 rounded border text-center" *ngIf="filteredCompanies.length == 0">
    No companies found.
  </div>



  <!-- table -->
  <div class="bg-white border rounded" *ngIf="filteredCompanies.length > 0">
    <table class="w-full text-left">

      <thead class="bg-gray-50">
        <tr>
          <th class="p-3">Name</th>
          <th class="p-3">Country</th>
          <th class="p-3">Status</th>
          <th class="p-3">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let c of filteredCompanies" [routerLink]="['/companies/details', c.id]" class="border-b hover:bg-slate-50 transition cursor-pointer">

          <td class="p-3">{{ c.name }}</td>

          <td class="p-3">{{ c.country }}</td>


          <td class="p-3">
            <span
              class="px-2 py-1 text-xs font-medium rounded-full"
              [ngClass]="{
                'bg-yellow-100 text-yellow-700': c.status === 'PENDING',
                'bg-green-100 text-green-700': c.status === 'ACTIVE',
                'bg-red-100 text-red-700': c.status === 'REJECTED',
                'bg-orange-100 text-orange-700': c.status === 'SUSPENDED',
                'bg-gray-100 text-gray-600': c.status === 'ARCHIVED'
              }"
            >
              {{ c.status }}
            </span>
          </td>

          <td class="p-3 flex gap-3">

            <a [routerLink]="['/companies', c.id]"
               class="text-blue-600">
              Edit
            </a>

            <button
              (click)="archive(c.id)"
              *ngIf="c.status != 'ARCHIVED'"
              class="text-red-600">
              Archive
            </button>

          </td>

        </tr>
      </tbody>

    </table>
  </div>

</div>
