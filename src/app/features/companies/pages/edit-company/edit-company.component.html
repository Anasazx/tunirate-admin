<div class="max-w-4xl mx-auto">

  <div class="bg-white rounded-xl border shadow-sm p-8">

    <h2 class="text-2xl font-bold mb-8">
      Edit Company
    </h2>

    <div *ngIf="message"

         class="mb-6 px-4 py-3 rounded-lg text-sm font-medium border"

         [ngClass]="{

       'bg-green-50 text-green-700 border-green-200': !isError,

       'bg-red-50 text-red-700 border-red-200': isError

     }">

      {{ message }}

    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- Name -->
      <div class="md:col-span-2">
        <label class="block text-sm font-medium mb-2">
          Company Name
        </label>

        <input
          [(ngModel)]="form.name"
          class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
      </div>

      <!-- Description -->
      <div class="md:col-span-2">
        <label class="block text-sm font-medium mb-2">
          Description
        </label>

        <textarea
          [(ngModel)]="form.description"
          rows="5"
          class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </textarea>
      </div>

      <!-- Phone -->
      <div>
        <label class="block text-sm font-medium mb-2">
          Phone Number
        </label>

        <input
          [(ngModel)]="form.phoneNumber"
          class="w-full border rounded-lg px-4 py-2">
      </div>

      <!-- Website -->
      <div>
        <label class="block text-sm font-medium mb-2">
          Website
        </label>

        <input
          [(ngModel)]="form.websiteUrl"
          placeholder="https://example.com"
          class="w-full border rounded-lg px-4 py-2">
      </div>

      <!-- Address -->
      <div class="md:col-span-2">
        <label class="block text-sm font-medium mb-2">
          Address
        </label>

        <input
          [(ngModel)]="form.address"
          class="w-full border rounded-lg px-4 py-2">
      </div>

      <!-- Country -->
      <div>
        <label class="block text-sm font-medium mb-2">
          Country
        </label>

        <select
          [(ngModel)]="form.country"
          class="w-full border rounded-lg px-4 py-2">

          <option [ngValue]="null">Select country</option>

          <option *ngFor="let c of countries" [ngValue]="c">
            {{ c }}
          </option>

        </select>
      </div>

      <!-- Industry -->
      <div>
        <label class="block text-sm font-medium mb-2">
          Industry
        </label>
        <select
          [(ngModel)]="form.industry"
          class="w-full border rounded-lg px-4 py-2">
          <option [ngValue]="null">Select industry</option>
          <option *ngFor="let i of industries" [ngValue]="i">
            {{ i }}
          </option>
        </select>
      </div>

      <!-- Social Links -->
      <div class="md:col-span-2">
        <div class="flex items-center justify-between mb-2">
          <label class="block text-sm font-medium">
            Social Links
          </label>
          <button
            (click)="addSocialLink()"
            class="px-3 py-1.5 border rounded-lg text-sm hover:bg-gray-100">
            Add Social
          </button>
        </div>

        <div
          *ngIf="form.socialLinks.length == 0"
          class="rounded-xl border border-dashed border-slate-300 bg-slate-50 py-8 flex flex-col items-center justify-center text-center">
          <p class="text-sm font-medium text-slate-600">
            No social links yet
          </p>
          <p class="mt-1 text-xs text-slate-400">
            Click <span class="font-medium">"Add Social"</span> to add your first social link.
          </p>
        </div>

        <div class="space-y-3">
          <div
            *ngFor="let link of form.socialLinks; let i = index"
            class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end"
          >

            <!-- Platform -->
            <div class="md:col-span-4">
              <label class="block text-xs font-medium mb-1">
                Platform
              </label>

              <select
                [(ngModel)]="link.platform"
                class="w-full border rounded-lg px-3 py-2"
              >
                <option *ngFor="let platform of socialPlatforms" [ngValue]="platform">
                  {{ platform }}
                </option>
              </select>
            </div>

            <!-- URL -->
            <div class="md:col-span-6">
              <label class="block text-xs font-medium mb-1">
                URL
              </label>

              <input
                [(ngModel)]="link.url"
                placeholder="https://example.com"
                class="w-full border rounded-lg px-3 py-2"
              />
            </div>

            <!-- REMOVE -->
            <div class="md:col-span-2 flex items-end">
              <button
                type="button"
                (click)="removeSocialLink(i)"
                class="px-3 py-2 inline-flex items-center justify-center
                rounded-lg border border-red-200
                text-red-600 hover:bg-red-50 transition
                text-sm font-medium w-full"
              >
                Remove
              </button>
            </div>
          </div>
        </div>
      </div>


      <!-- Status -->
      <div class="md:col-span-2">
        <label class="block text-sm font-medium mb-2">
          Company Status
        </label>

        <select
          [(ngModel)]="form.status"
          class="w-full border rounded-lg px-4 py-2">

          <option value="PENDING">Pending</option>
          <option value="ACTIVE">Active</option>
          <option value="REJECTED">Rejected</option>
          <option value="SUSPENDED">Suspended</option>
          <option value="ARCHIVED">Archived</option>

        </select>
      </div>

    </div>

    <!-- Images -->
    <div class="grid md:grid-cols-2 gap-6 mt-8">

      <!-- Logo -->
      <div class="border rounded-xl p-5 flex flex-col">

        <h3 class="font-semibold mb-4">
          Company Logo
        </h3>

        <div class="flex-1 flex items-center justify-center mb-4 min-h-[160px]">

          <img
            *ngIf="company?.logoUrl; else noLogo"
            [src]="sharedService.getImageUrl(company.logoUrl)"
            class="h-28 w-28 rounded-full object-cover border">

          <ng-template #noLogo>
            <div class="h-28 w-28 rounded-full bg-gray-100 flex items-center justify-center text-gray-400">
              No Logo
            </div>
          </ng-template>

        </div>

        <div class="space-y-3">
          <input
            type="file"
            class="w-full"
            (change)="onLogoSelected($event)">

          <button
            *ngIf="company?.logoUrl"
            (click)="deleteLogo()"
            class="text-red-600 hover:underline text-sm">
            Remove Logo
          </button>
        </div>

      </div>

      <!-- Banner -->
      <div class="border rounded-xl p-5 flex flex-col">

        <h3 class="font-semibold mb-4">
          Company Banner
        </h3>

        <div class="flex-1 flex items-center mb-4 min-h-[160px]">

          <img
            *ngIf="company?.bannerUrl; else noBanner"
            [src]="sharedService.getImageUrl(company.bannerUrl)"
            class="w-full h-40 rounded-lg object-cover border">

          <ng-template #noBanner>
            <div class="w-full h-40 rounded-lg bg-gray-100 flex items-center justify-center text-gray-400">
              No Banner
            </div>
          </ng-template>

        </div>

        <div class="space-y-3">
          <input
            type="file"
            class="w-full"
            (change)="onBannerSelected($event)">

          <button
            *ngIf="company?.bannerUrl"
            (click)="deleteBanner()"
            class="text-red-600 hover:underline text-sm">
            Remove Banner
          </button>
        </div>

      </div>

    </div>

    <!-- Buttons -->
    <div class="flex justify-end gap-3 mt-10">

      <button
        (click)="cancel()"
        class="px-5 py-2 border rounded-lg hover:bg-gray-100">
        Cancel
      </button>

      <button
        (click)="save()"
        class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg">
        Save Changes
      </button>

    </div>

  </div>

</div>
