<div class="max-w-6xl mx-auto p-8 space-y-8" *ngIf="product; else loadingTpl">

  <!-- HEADER -->
  <div class="flex items-start justify-between">

    <div>

      <p class="text-sm text-slate-500">
        Edit Product
      </p>

      <h1 class="text-3xl font-bold text-slate-900 mt-1">
        {{ product.name }}
      </h1>

      <div class="flex items-center gap-2 mt-3 text-sm text-slate-500">

        <span>{{ product.companyName }}</span>

        <span>•</span>

        <span>#{{ product.id }}</span>

        <span
          class="rounded-full px-3 py-1 text-xs font-medium"
          [ngClass]="{
            'bg-green-100 text-green-700': product.status === 'PUBLISHED',
            'bg-amber-100 text-amber-700': product.status === 'PENDING_REVIEW',
            'bg-red-100 text-red-700': product.status === 'REJECTED',
            'bg-slate-200 text-slate-700': product.status === 'ARCHIVED'
          }">

          {{ product.status }}

        </span>

      </div>

    </div>

    <!-- ACTIONS -->
    <div class="flex gap-2">

      <button
        (click)="back()"
        class="rounded-xl border px-4 py-2 text-sm hover:bg-slate-50">

        Cancel

      </button>

      <button
        (click)="save()"
        [disabled]="saving"
        class="rounded-xl bg-blue-600 px-5 py-2 text-sm text-white hover:bg-blue-700 disabled:opacity-50">

        {{ saving ? 'Saving...' : 'Save Changes' }}

      </button>

    </div>

  </div>

  <!-- GRID -->
  <div class="grid lg:grid-cols-3 gap-8">

    <!-- LEFT -->
    <div class="lg:col-span-2 space-y-6">

      <!-- PRODUCT FORM -->
      <div class="bg-white border rounded-2xl p-6 space-y-4">

        <h3 class="font-semibold text-slate-900">
          Product Details
        </h3>

        <input
          [(ngModel)]="product.name"
          placeholder="Product name"
          class="w-full rounded-xl border bg-slate-50 px-4 py-3">

        <select
          [(ngModel)]="selectedSubcategoryId"
          class="w-full rounded-xl border bg-slate-50 px-4 py-3">

          <option [ngValue]="null">Select subcategory</option>

          <option *ngFor="let s of subcategories" [ngValue]="s.id">
            {{ s.name }}
          </option>

        </select>

        <select
          [(ngModel)]="product.companyId"
          class="w-full rounded-xl border bg-slate-50 px-4 py-3">

          <option [ngValue]="null">Select company</option>

          <option *ngFor="let c of companies" [ngValue]="c.id">
            {{ c.name }}
          </option>

        </select>

        <textarea
          [(ngModel)]="product.description"
          rows="6"
          placeholder="Description..."
          class="w-full rounded-xl border bg-slate-50 px-4 py-3">

        </textarea>

      </div>

      <!-- REVIEWS -->
      <div class="bg-white border rounded-2xl p-6">

        <div class="flex items-center justify-between mb-4">

          <h3 class="font-semibold">
            Reviews
          </h3>

          <span class="text-sm text-slate-500">
            {{ product.reviewsCount || 0 }}
          </span>

        </div>

        <div class="space-y-4">

          <div *ngFor="let r of product.reviews"
               class="border rounded-xl p-4">

            <div class="flex justify-between">

              <span class="font-medium">
                {{ r.userName }}
              </span>

              <span class="text-yellow-500">
                ★ {{ r.rating }}
              </span>

            </div>

            <p class="text-sm text-slate-600 mt-2">
              {{ r.content }}
            </p>

          </div>

        </div>

      </div>

    </div>

    <!-- RIGHT -->
    <div class="space-y-6">

      <!-- MEDIA MANAGER -->
      <div class="bg-white border rounded-2xl p-6 space-y-4">

        <h3 class="font-semibold">
          Product Image
        </h3>

        <div class="rounded-xl border overflow-hidden bg-slate-50">

          <img
            [src]="mainImageUrl ? sharedService.getImageUrl(mainImageUrl) : 'assets/placeholder.png'"
            class="w-full h-56 object-contain p-4">

        </div>

        <input
          type="file"
          (change)="onFileSelected($event)"
          class="w-full border rounded-xl p-3">

        <button
          (click)="uploadFile()"
          [disabled]="imageSaving || !selectedFile"
          class="w-full rounded-xl bg-indigo-600 py-2 text-white hover:bg-indigo-700 disabled:opacity-50">

          {{ imageSaving ? 'Uploading...' : 'Upload Image' }}

        </button>

      </div>

      <!-- GALLERY -->
      <div class="bg-white border rounded-2xl p-6">

        <h3 class="font-semibold mb-4">
          Gallery
        </h3>

        <div class="grid grid-cols-2 gap-3">

          <div *ngFor="let img of product.images"
               class="relative rounded-xl overflow-hidden border">

            <img
              [src]="sharedService.getImageUrl(img.url)"
              class="h-28 w-full object-cover">

            <div class="absolute inset-0 bg-black/0 hover:bg-black/40 transition flex items-center justify-center gap-2 opacity-0 hover:opacity-100">

              <button
                (click)="setMainImage(img.id!)"
                class="bg-white px-2 py-1 text-xs rounded">

                Main

              </button>

              <button
                (click)="deleteImage(img.id!)"
                class="bg-red-500 text-white px-2 py-1 text-xs rounded">

                Delete

              </button>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>

<!-- LOADING -->
<ng-template #loadingTpl>

  <div class="h-[60vh] flex items-center justify-center text-slate-400">
    Loading product...
  </div>

</ng-template>
