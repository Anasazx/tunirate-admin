<div class="max-w-6xl mx-auto p-8 space-y-8" *ngIf="product; else loadingTpl">

  <!-- HEADER -->
  <div class="flex items-start justify-between">

    <div>

      <p class="text-sm text-slate-500">
        Edit Product
      </p>

      <h1 class="text-3xl font-bold text-slate-900 mt-1">
        {{ product.name }}
      </h1>

      <div class="flex items-center gap-2 mt-3 text-sm text-slate-500">
        <span>{{ product.companyName }}</span>
        <span>•</span>
        <span>#{{ product.id }}</span>
        <span
          class="rounded-full px-3 py-1 text-xs font-medium"
          [ngClass]="{
            'bg-green-100 text-green-700': product.status === 'PUBLISHED',
            'bg-amber-100 text-amber-700': product.status === 'PENDING_REVIEW',
            'bg-red-100 text-red-700': product.status === 'REJECTED',
            'bg-slate-200 text-slate-700': product.status === 'ARCHIVED'
          }">
          {{ product.status }}
        </span>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="flex gap-2">
      <button
        (click)="back()"
        class="rounded-xl border px-4 py-2 text-sm hover:bg-slate-50">
        Cancel
      </button>
      <button
        (click)="save()"
        [disabled]="saving"
        class="rounded-xl bg-blue-600 px-5 py-2 text-sm text-white hover:bg-blue-700 disabled:opacity-50">
        {{ saving ? 'Saving...' : 'Save Changes' }}
      </button>
    </div>
  </div>

  <!-- ERROR -->
  <div *ngIf="error" class="p-4 rounded-xl bg-red-50 text-red-700 border">
    {{ error }}
  </div>

  <!-- MAIN GRID -->
  <div class="grid lg:grid-cols-3 gap-8">

    <!-- LEFT SIDE -->
    <div class="lg:col-span-2 space-y-6">

      <!-- PRODUCT FORM -->
      <div class="bg-white border rounded-2xl p-6 space-y-4">

        <h3 class="font-semibold text-slate-900">
          Product Details
        </h3>
        <input
          [(ngModel)]="product.name"
          placeholder="Product name"
          class="w-full rounded-xl border bg-slate-50 px-4 py-3">
        <select
          [(ngModel)]="selectedSubcategoryId"
          class="w-full rounded-xl border bg-slate-50 px-4 py-3">
          <option [ngValue]="null">
            Select subcategory
          </option>
          <option
            *ngFor="let s of subcategories"
            [ngValue]="s.id">
            {{ s.name }}
          </option>
        </select>
        <select
          [(ngModel)]="product.companyId"
          class="w-full rounded-xl border bg-slate-50 px-4 py-3">
          <option [ngValue]="null">
            Select company
          </option>
          <option
            *ngFor="let c of companies"
            [ngValue]="c.id">
            {{ c.name }}
          </option>
        </select>

        <!-- STATUS -->
        <div>

          <label class="text-sm text-slate-500 block mb-1">
            Product Status
          </label>


          <select
            [(ngModel)]="product.status"
            class="w-full rounded-xl border bg-white px-4 py-3">


            <option [ngValue]="null">
              Select status
            </option>


            <option
              *ngFor="let status of productStatusValues"
              [ngValue]="status">

              {{ status.replace('_', ' ') }}

            </option>


          </select>

        </div>

        <textarea
          [(ngModel)]="product.description"
          rows="6"
          placeholder="Description..."
          class="w-full rounded-xl border bg-slate-50 px-4 py-3">
        </textarea>
      </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="space-y-6">

      <!-- MAIN IMAGE -->
      <div class="bg-white border rounded-2xl p-6 space-y-4">
        <h3 class="font-semibold">
          Product Images
        </h3>

        <!-- MAIN IMAGE -->
        <div class="rounded-xl border overflow-hidden bg-slate-50">
          <img
            *ngIf="mainImageUrl"
            [src]="sharedService.getImageUrl(mainImageUrl)"
            class="w-full h-80 object-contain p-4">
          <div
            *ngIf="!mainImageUrl"
            class="h-80 flex items-center justify-center text-slate-400">
            No image
          </div>
        </div>

        <!-- FILE INPUT -->
        <input
          #fileInput
          type="file"
          multiple
          accept="image/*"
          (change)="onFileSelected($event)"
          class="w-full border rounded-xl p-3">

        <!-- PREVIEW -->
        <div
          *ngIf="previewUrls.length"
          class="grid grid-cols-3 gap-3">
          <div
            *ngFor="let url of previewUrls; let i=index"
            class="relative border rounded-xl overflow-hidden">
            <img
              [src]="url"
              class="h-24 w-full object-cover">
            <button
              (click)="removeSelectedFile(i)"
              class="absolute top-1 right-1 bg-red-500 text-white rounded-full px-2">
              ×
            </button>
          </div>
        </div>
        <button
          (click)="save()"
          [disabled]="saving || selectedFiles.length === 0"
          class="w-full rounded-xl bg-indigo-600 py-2 text-white disabled:opacity-50">
          {{ saving ? 'Uploading...' : 'Save Images & Product' }}
        </button>
      </div>

      <!-- GALLERY -->
      <div class="bg-white border rounded-2xl p-6">
        <h3 class="font-semibold mb-4">
          Gallery
        </h3>
        <div class="grid grid-cols-2 gap-3">
          <p *ngIf="product.images.length === 0"
             class="text-slate-400">
            No images yet
          </p>
          <div
            *ngFor="let img of product.images"
            class="relative rounded-xl overflow-hidden border">
            <img
              [src]="sharedService.getImageUrl(img.url)"
              class="h-28 w-full object-cover">
            <div
              class="absolute inset-0 bg-black/40 opacity-0 hover:opacity-100 transition flex items-center justify-center gap-2">
              <button
                (click)="setMainImage(img.id!)"
                class="bg-white px-3 py-1 rounded text-xs">
                Main
              </button>
              <button
                (click)="deleteImage(img.id!)"
                class="bg-red-500 text-white px-3 py-1 rounded text-xs">
                Delete
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #loadingTpl>
  <div class="h-[60vh] flex items-center justify-center text-slate-400">
    Loading product...
  </div>
</ng-template>
